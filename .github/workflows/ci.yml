name: Validate

# Pull requests are validated, and nothing is uploaded: no workflow artifacts, no releases. Every commit that lands on main is
# validated again and, if everything passes, becomes a release candidate: a pre-release carrying Windows and Linux installers.
# Those installers exist only as assets of that release. The Release workflow promotes one of the candidates.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled: stopping a main run could leave a half-published release candidate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI build and test
    # Windows has Chrome and Edge ready for Karma, and the build output is the same on every platform.
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Test
        working-directory: ui
        run: npm test -- --watch=false --browsers=ChromeHeadless

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The Tauri crate embeds the built UI when it is compiled, so the UI has to be built here too. Each job builds its own
      # copy rather than receiving one from the UI job, because nothing is uploaded or shared between jobs.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI
        run: |
          npm ci --prefix ui
          npm run build --prefix ui

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # From here on the workflow only runs for commits on main, after the jobs above passed.
  prepare:
    name: Prepare release candidate
    needs: [ui, rust]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, so two quick merges cannot pick the same candidate number. The draft created here reserves the number.
    concurrency:
      group: release-candidate
      cancel-in-progress: false
    outputs:
      base: ${{ steps.version.outputs.base }}
      candidate: ${{ steps.version.outputs.candidate }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine the version and candidate number
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Get-NextVersion.ps1 -Candidate

      # A draft has no tag. GitHub creates the tag when the draft is published, so a failure anywhere below cannot leave a tag
      # without a release. The installers are attached to this draft by the package jobs.
      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.version.outputs.candidate }}
        run: |
          gh release delete "$CANDIDATE" --yes 2>/dev/null || true
          gh release create "$CANDIDATE" --draft --prerelease --target "$GITHUB_SHA" --title "$CANDIDATE" --generate-notes

  package:
    name: Package (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-latest
            platform: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    # Write access is only used by the last step, to attach this platform's installers to the draft pre-release.
    permissions:
      contents: write
    env:
      # AppImage tooling needs FUSE, which hosted runners lack; this makes it unpack and run in place instead.
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ui

      # The version is stamped on this throwaway checkout only; nothing is committed. The app carries the release version
      # (0.1.3), never the candidate number, so promoting a candidate to a release does not change the installers. The
      # candidate number appears only in the tag and the file names.
      - name: Stamp the release version
        shell: pwsh
        run: ./eng/Set-Version.ps1 -Version '${{ needs.prepare.outputs.base }}'

      - name: Build installers
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Collect installers and checksums
        shell: pwsh
        run: ./eng/Collect-Packages.ps1 -Version '${{ needs.prepare.outputs.candidate }}' -Platform '${{ matrix.platform }}'

      - name: Attach the installers to the draft pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          $ErrorActionPreference = 'Stop'
          [string[]]$files = @(Get-ChildItem -File artifacts/packages | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No installers to attach.' }
          gh release upload $env:CANDIDATE @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Attaching the installers to $env:CANDIDATE failed." }

  publish:
    name: Publish release candidate
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: gh release edit "$CANDIDATE" --draft=false --prerelease

      - name: Keep only the newest three candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Prune-ReleaseCandidates.ps1 -BaseVersion '${{ needs.prepare.outputs.base }}' -Keep 3
