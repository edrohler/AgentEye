<input
  type="search"
  class="w-full rounded-md border border-line bg-transparent px-3 py-1.5 text-inherit focus-visible:outline-2 focus-visible:outline-accent"
  placeholder="Search all sessions…"
  aria-label="Search all sessions"
  [value]="query()"
  (input)="onInput($event)"
  (keydown.escape)="clear()"
/>
