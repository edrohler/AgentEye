<header class="flex items-center gap-4 border-b border-line px-6 py-3">
  <h1 class="mr-auto text-xl font-semibold">
    <a routerLink="/">AgentEye</a>
  </h1>
  <app-index-status />
  <a
    class="btn btn-icon"
    [routerLink]="onSettings() ? '/' : '/settings'"
    [attr.aria-label]="onSettings() ? 'Close settings' : 'Open settings'"
    [title]="onSettings() ? 'Close settings' : 'Settings'"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      @if (onSettings()) {
        <path d="M6 6l12 12M18 6L6 18" />
      } @else {
        <path d="M4 7h16M4 12h16M4 17h16" />
      }
    </svg>
  </a>
</header>

<main>
  <router-outlet />
</main>
