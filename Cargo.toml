[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[workspace.dependencies]
agenteye-core = { path = "crates/agenteye-core" }
agenteye-index = { path = "crates/agenteye-index" }
agenteye-sources = { path = "crates/agenteye-sources" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
